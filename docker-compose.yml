# Ambiente local completo: API + Postgres.
# Uso:  docker compose up --build
# `version:` foi removido de propósito — obsoleto no Compose v2.

services:
  api:
    build:
      context: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Sobrescreve o .env: dentro da rede do compose o host do banco é o
      # nome do serviço, não localhost.
      DATABASE_URL: postgresql://admin:admin@postgres:5432/ic?schema=public
      PORT: 5000
    ports:
      - '5000:5000'
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:13.5
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: ic
    volumes:
      - postgres:/var/lib/postgresql/data
    ports:
      # 5433 no host pra não conflitar com um Postgres já instalado localmente
      - '5433:5432'
    healthcheck:
      # sem isso a API sobe antes do banco aceitar conexão e o migrate falha
      test: ['CMD-SHELL', 'pg_isready -U admin -d ic']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres:
