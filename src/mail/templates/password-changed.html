<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
      rel="stylesheet"
    />
    <title>Senha alterada</title>

    <style>
      body {
        font-family: 'Plus Jakarta Sans', Arial, sans-serif;
        margin: 0;
        padding: 40px;
        background-color: #ffffff;
        color: #1a1a1a;
      }

      .logo {
        width: 170px;
        height: auto;
        margin-bottom: 32px;
      }

      .title {
        font-weight: 500;
        font-size: 22px;
        margin: 0 0 16px;
      }

      .text {
        font-size: 14px;
        max-width: 600px;
        line-height: 26px;
        margin: 0 0 16px;
      }

      .muted {
        font-size: 13px;
        line-height: 22px;
        color: #6b7280;
        max-width: 600px;
      }
    </style>
  </head>
  <body>
    <img class="logo" src="cid:logo" alt="Igreja de Cristo Cidade Verde" />

    <h1 class="title">Sua senha foi alterada</h1>

    <p class="text">Olá, {userName}.</p>
    <p class="text">
      A senha do seu acesso acabou de ser redefinida. Se foi você, não precisa
      fazer nada.
    </p>

    <p class="muted">
      Se não foi você, responda este e-mail agora mesmo: alguém teve acesso ao
      código enviado para esta caixa de entrada.
    </p>
  </body>
</html>
