name: Build and publish Docker image

on:
  push:
    branches: ['main', 'homolog']
  workflow_dispatch:

env:
  # GitHub Container Registry do próprio repo (ghcr.io/felipeqq/ic-backend).
  # Nada de registry externo: o GITHUB_TOKEN do job já autentica aqui.
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    # ubuntu-latest é linux/amd64 nativo — é isso que garante a arquitetura
    # certa pro servidor, sem emulação.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          # a action já converte o nome do repo pra lowercase, exigência do GHCR
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set build arguments
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "COMMIT_HASH=${{ github.ref_name }}-$SHORT_SHA" >> $GITHUB_ENV
          echo "COMMIT_DATE=${{ github.event.head_commit.timestamp }}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            COMMIT_HASH=${{ env.COMMIT_HASH }}
            COMMIT_DATE=${{ env.COMMIT_DATE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
