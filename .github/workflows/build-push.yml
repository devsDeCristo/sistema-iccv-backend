name: Build and publish Docker image

on:
  push:
    branches: ['main']
  workflow_dispatch:

env:
  # GitHub Container Registry do próprio repo (ghcr.io/devsdecristo/sistema-iccv-backend).
  # Nada de registry externo: o GITHUB_TOKEN do job já autentica aqui.
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Espelhado em env porque `if:` não enxerga o contexto `secrets`. Enquanto o
  # secret não existir, o passo de deploy é pulado em vez de quebrar o build.
  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}

jobs:
  build-and-push-image:
    # ubuntu-latest é linux/amd64 nativo — é isso que garante a arquitetura
    # certa pro servidor, sem emulação.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          # a action já converte o nome do repo pra lowercase, exigência do GHCR
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set build arguments
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "COMMIT_HASH=${{ github.ref_name }}-$SHORT_SHA" >> $GITHUB_ENV
          echo "COMMIT_DATE=${{ github.event.head_commit.timestamp }}" >> $GITHUB_ENV
          # O nome do repo tem maiúsculas (devsDeCristo) e o Docker só aceita
          # referência minúscula. A metadata-action normaliza sozinha no build;
          # o `docker service update` do deploy precisa desta versão pronta.
          echo "IMAGE_LC=$(echo '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            COMMIT_HASH=${{ env.COMMIT_HASH }}
            COMMIT_DATE=${{ env.COMMIT_DATE }}
          # provenance/sbom desligados de propósito: eles criam manifests
          # "untagged" extras no package, que confundem a limpeza por retenção
          # (e não agregam nada num build de plataforma única).
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Todas as secrets do repositório/organização viram variável de ambiente
      # do serviço — secret nova entra sozinha, sem declarar uma a uma aqui.
      #
      # Elas vão para o SERVIÇO no deploy, e não para a imagem: o package do
      # GHCR é público, e `ENV` no Dockerfile (ou build-arg) vira camada da
      # imagem — `docker pull` + `docker inspect` entregariam banco, JWT e a
      # chave das credenciais de cobrança a qualquer um.
      #
      # O pacote vai como uma variável só, em base64: pares CHAVE=valor
      # separados por NUL, porque há valor com quebra de linha (chave privada).
      - name: Preparar as secrets para o serviço
        if: github.ref == 'refs/heads/main' && env.DEPLOY_HOST != ''
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
          # secrets só do CI: não entram no serviço
          SKIP_SECRETS: '^(github_token|DEPLOY_HOST|DEPLOY_USER|DEPLOY_PASSWORD)$'
        run: |
          PACOTE=$(jq -j --arg skip "$SKIP_SECRETS" '
            to_entries
            | map(select((.key | test($skip; "i") | not) and .value != ""))
            | .[] | "\(.key)=\(.value)\u0000"
          ' <<< "$ALL_SECRETS" | base64 -w0)
          # o base64 não é mascarado sozinho pelo GitHub
          echo "::add-mask::$PACOTE"
          echo "SERVICE_SECRETS=$PACOTE" >> "$GITHUB_ENV"
          QUANTAS=$(jq --arg skip "$SKIP_SECRETS" '[to_entries[] | select((.key | test($skip; "i") | not) and .value != "")] | length' <<< "$ALL_SECRETS")
          echo "$QUANTAS secrets vão para o serviço"

      # Troca a imagem do serviço no Swarm. O `docker service update` baixa a
      # imagem no nó, para a task antiga e sobe a nova — não existe pull nem
      # restart separado. Ele roda attached, então só retorna quando o serviço
      # convergiu: se o healthcheck da API não passar, o Swarm faz rollback
      # (failure_action no stack file) e este passo falha junto.
      - name: Atualizar o serviço no Swarm
        if: github.ref == 'refs/heads/main' && env.DEPLOY_HOST != ''
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          # Autenticação por senha (a mesma que a VM pede no terminal). Para
          # migrar pra chave depois: troque por `key:` com o conteúdo do
          # arquivo de chave privada, não com uma senha.
          password: ${{ secrets.DEPLOY_PASSWORD }}
          # Leva o pacote de secrets para dentro do script remoto. Sem isto o
          # `script` roda na VM sem enxergar nada do ambiente do runner.
          envs: SERVICE_SECRETS
          script: |
            bash -eu <<'DEPLOY'
            args=(--with-registry-auth --force)

            # Uma --env-add por secret. `--env-add` cria ou atualiza; secret que
            # não existe mais no GitHub fica no serviço até um --env-rm manual.
            # Secret vazia nem chega aqui: apagaria o valor em uso.
            while IFS= read -r -d '' par; do
              args+=(--env-add "$par")
            done < <(printf '%s' "$SERVICE_SECRETS" | base64 -d)

            # O package é público, então o pull é anônimo e --with-registry-auth
            # não é necessário hoje. Fica pelo caso de fecharem o package: aí ele
            # repassa aos agentes do Swarm a credencial do ~/.docker/config.json.
            docker service update \
              "${args[@]}" \
              --image ${{ env.IMAGE_LC }}:latest \
              sistema-eventos-iccv_api
            DEPLOY

      # Cada push cria uma versão nova de imagem (tag type=sha). Sem limpeza o
      # storage do package cresce indefinidamente — mantém só as 10 mais recentes.
      - name: Prune old package versions
        uses: actions/delete-package-versions@v5
        # No primeiro push de um repo novo o package ainda não existe e a action
        # retorna erro — isso não pode marcar o job como falho.
        continue-on-error: true
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: container
          min-versions-to-keep: 10
          # nunca apaga as tags de ambiente, mesmo se saírem das 10 recentes
          ignore-versions: '^(latest|main|homolog)$'
